<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

:root{
  --bg:#020617;
  --card:#111827;
  --text:#ffffff;
  --muted:#94a3b8;
  --primary:#2563eb;
  --border:rgba(255,255,255,0.08);
}

body.light{
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --border:rgba(0,0,0,0.08);
}

body{
  background:var(--bg);
  color:var(--text);
  transition:0.4s ease;
}

/* ================= LAYOUT ================= */
.dashboard{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}

/* ================= SIDEBAR ================= */
.sidebar{
  background:var(--card);
  padding:30px;
  border-right:1px solid var(--border);
}

.sidebar h2{
  margin-bottom:30px;
}

.sidebar a{
  display:block;
  color:var(--text);
  text-decoration:none;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
  transition:0.3s;
}

.sidebar a:hover,
.sidebar a.active{
  background:var(--primary);
  color:white;
}

/* ================= MAIN ================= */
.main{
  padding:30px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ================= PROFILE CARD ================= */
.card{
  background:var(--card);
  padding:40px;
  border-radius:20px;
  width:100%;
  max-width:500px;
  text-align:center;
  border:1px solid var(--border);
  animation:fadeUp 1s ease;
}

.card img{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:20px;
  border:4px solid rgba(37,99,235,0.3);
}

.card h2{
  margin-bottom:10px;
}

.card p{
  margin:10px 0;
  color:var(--muted);
}

/* ================= TOPBAR ================= */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.toggle-btn,
.menu-btn{
  background:var(--primary);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
}

/* ================= ANIMATION ================= */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= MOBILE ================= */
.menu-btn{
  display:none;
}

@media(max-width:900px){

  .dashboard{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    width:260px;
    height:100%;
    z-index:1000;
    transition:0.4s;
  }

  .sidebar.active{
    left:0;
  }

  .menu-btn{
    display:block;
  }

}

</style>

</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <h2>FUNATO</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="result.html">Results</a>
    <a href="courses.html">Courses</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="profile.html" class="active">Profile</a>
    <a href="logout.html">Logout</a>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <div>

      <!-- TOPBAR -->
      <div class="topbar">

        <button class="menu-btn" id="menuBtn">☰</button>

        <h1>Your Profile</h1>

        <button class="toggle-btn" id="themeBtn">🌙 Theme</button>

      </div>

      <!-- PROFILE CARD -->
      <div class="card">

        <img src="https://via.placeholder.com/130">

        <h2>Abdulazeez Fatimoh Adeola</h2>

        <p>Department: Software Engineering</p>
        <p>Level: 100</p>
        <p>Matric Number: FUN/CSC/2025/001</p>
        <p>Email: fatimahabdulazee99z@gmail.com</p>

      </div>

    </div>

  </main>

</div>

<script>

/* THEME */
const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {
  document.body.classList.toggle("light");
});

/* SIDEBAR */
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("active");
});

</script>

</body>
</html>
