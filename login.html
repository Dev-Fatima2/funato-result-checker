<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(to bottom right,#020617,#0f172a);
}

.card{
  width:90%;
  max-width:450px;
  background:#111827;
  padding:40px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
  animation:fadeUp 1s ease;
}

.card h2{
  color:white;
  text-align:center;
  margin-bottom:30px;
}

.form-group{
  margin-bottom:20px;
}

input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#1e293b;
  color:white;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-3px);
}

p{
  color:#94a3b8;
  text-align:center;
  margin-top:20px;
}

a{
  color:#60a5fa;
}

.password-group{
  position:relative;
}

.toggle-password,
.password-toggle{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#94a3b8;
  font-size:18px;
  user-select:none;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>

</head>

<body>

<div class="card">

  <h2>Student Login</h2>

  <form id="loginForm">

    <div class="form-group">
      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
      >
    </div>

    <div class="form-group password-group">

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <span class="toggle-password password-toggle">
        👁️
      </span>

    </div>

    <button type="submit" id="loginBtn">
      Login
    </button>

  </form>

  <p>
    Don't have an account?
    <a href="register.html">Register</a>
  </p>

</div>

<script src="./assets/js/auth.js"></script>

</body>
</html>
