<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lecturers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

:root{

  --bg:#020617;
  --card:#111827;
  --text:#ffffff;
  --muted:#94a3b8;
  --primary:#2563eb;
  --border:rgba(255,255,255,0.08);

}

body.light{

  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --border:rgba(0,0,0,0.08);

}

body{
  background:var(--bg);
  color:var(--text);
  transition:0.4s ease;
}

/* LAYOUT */

.dashboard{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  background:var(--card);
  padding:30px;
  border-right:1px solid var(--border);
}

.sidebar h2{
  margin-bottom:30px;
}

.sidebar a{
  display:block;
  color:var(--text);
  text-decoration:none;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
  transition:0.3s;
}

.sidebar a:hover,
.sidebar a.active{
  background:var(--primary);
  color:white;
}

/* MAIN */

.main{
  padding:30px;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

/* BUTTONS */

.toggle-btn,
.menu-btn{
  background:var(--primary);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

/* CARD */

.card{
  background:var(--card);
  padding:30px 25px;
  border-radius:20px;
  border:1px solid var(--border);
  text-align:center;
  transition:0.3s;
  animation:fadeUp 1s ease;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:15px;
  border:4px solid rgba(255,255,255,0.08);
}

.card h3{
  margin-bottom:10px;
}

.card p{
  color:var(--muted);
  margin-bottom:15px;
}

.badge{
  display:inline-block;
  background:rgba(37,99,235,0.15);
  color:#60a5fa;
  padding:8px 14px;
  border-radius:30px;
  font-size:14px;
}

/* ANIMATION */

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(40px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* MOBILE */

.menu-btn{
  display:none;
}

@media(max-width:900px){

  .dashboard{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    width:260px;
    height:100%;
    z-index:1000;
    transition:0.4s;
  }

  .sidebar.active{
    left:0;
  }

  .menu-btn{
    display:block;
  }

}

</style>

</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <h2>FUNATO</h2>

    <a href="dashboard.html">Dashboard</a>

    <a href="result.html">Results</a>

    <a href="courses.html">Courses</a>

    <a href="lecturers.html" class="active">Lecturers</a>

    <a href="profile.html">Profile</a>

    <a href="logout.html">Logout</a>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <!-- TOPBAR -->

    <div class="topbar">

      <div>

        <button class="menu-btn" id="menuBtn">
          ☰
        </button>

        <h1>Lecturers</h1>

      </div>

      <button class="toggle-btn" id="themeBtn">
        🌙 Theme
      </button>

    </div>

    <!-- LECTURERS -->

    <div class="grid">

      <div class="card">

        <img src="https://via.placeholder.com/100">

        <h3>Dr. Samuel</h3>

        <p>
          Cyber Security Department
        </p>

        <span class="badge">
          Senior Lecturer
        </span>

      </div>

      <div class="card">

        <img src="https://via.placeholder.com/100">

        <h3>Mrs. Grace</h3>

        <p>
          Computer Science Department
        </p>

        <span class="badge">
          Lecturer II
        </span>

      </div>

      <div class="card">

        <img src="https://via.placeholder.com/100">

        <h3>Prof. Michael</h3>

        <p>
          Software Engineering Department
        </p>

        <span class="badge">
          Professor
        </span>

      </div>

      <div class="card">

        <img src="https://via.placeholder.com/100">

        <h3>Dr. Esther</h3>

        <p>
          Mathematics Department
        </p>

        <span class="badge">
          Associate Professor
        </span>

      </div>

    </div>

  </main>

</div>

<!-- JAVASCRIPT -->

<script>

/* THEME */

const themeBtn =
document.getElementById("themeBtn");

themeBtn.addEventListener("click",()=>{

  document.body.classList.toggle("light");

});

/* SIDEBAR */

const menuBtn =
document.getElementById("menuBtn");

const sidebar =
document.getElementById("sidebar");

menuBtn.addEventListener("click",()=>{

  sidebar.classList.toggle("active");

});

</script>

</body>
</html>
