<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

:root{

  --bg:#020617;
  --card:#111827;
  --text:#ffffff;
  --muted:#94a3b8;
  --primary:#2563eb;
  --border:rgba(255,255,255,0.08);

}

body.light{

  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --border:rgba(0,0,0,0.08);

}

body{
  background:var(--bg);
  color:var(--text);
  transition:0.4s ease;
}

.dashboard{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  background:var(--card);
  padding:30px;
  border-right:1px solid var(--border);
}

.sidebar h2{
  margin-bottom:30px;
}

.sidebar a{
  display:block;
  color:var(--text);
  text-decoration:none;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
  transition:0.3s;
}

.sidebar a:hover{
  background:var(--primary);
  color:white;
}

/* MAIN */

.main{
  padding:30px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

/* TOGGLE */

.toggle-btn{
  background:var(--primary);
  border:none;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.stat{
  background:var(--card);
  padding:25px;
  border-radius:20px;
  border:1px solid var(--border);
  animation:fadeUp 1s ease;
}

.stat h3{
  margin-bottom:10px;
}

.stat p{
  color:var(--muted);
}

/* TABLE */

.table-card{
  margin-top:30px;
  background:var(--card);
  padding:25px;
  border-radius:20px;
  border:1px solid var(--border);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

table th,
table td{
  padding:15px;
  border:1px solid var(--border);
  text-align:left;
}

table th{
  background:rgba(255,255,255,0.04);
}

/* ANIMATION */

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(40px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* MOBILE */

.menu-btn{
  display:none;
}

@media(max-width:900px){

  .dashboard{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:fixed;
    left:-100%;
    top:0;
    width:260px;
    height:100%;
    z-index:1000;
    transition:0.4s;
  }

  .sidebar.active{
    left:0;
  }

  .menu-btn{
    display:block;
    background:var(--primary);
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
  }

}

</style>

</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <h2>FUNATO</h2>

    <a href="dashboard.html">Dashboard</a>

    <a href="result.html">Results</a>

    <a href="courses.html">Courses</a>

    <a href="lecturers.html">Lecturers</a>

    <a href="profile.html">Profile</a>

    <a href="index.html">Logout</a>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <div class="topbar">

      <div>

        <button class="menu-btn" id="menuBtn">
          ☰
        </button>

        <h1>Welcome Back 👋</h1>

      </div>

      <button class="toggle-btn" id="themeBtn">
        🌙 Theme
      </button>

    </div>

    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <h3>Current GPA</h3>
        <p>4.50</p>
      </div>

      <div class="stat">
        <h3>Current CGPA</h3>
        <p>4.20</p>
      </div>

      <div class="stat">
        <h3>Registered Courses</h3>
        <p>8 Courses</p>
      </div>

    </div>

    <!-- TABLE -->

    <div class="table-card">

      <h2>Recent Results</h2>

      <table>

        <tr>
          <th>Course</th>
          <th>Score</th>
          <th>Grade</th>
        </tr>

        <tr>
          <td>CYB 103</td>
          <td>85</td>
          <td>A</td>
        </tr>

        <tr>
          <td>MTH 101</td>
          <td>78</td>
          <td>A</td>
        </tr>

      </table>

    </div>

  </main>

</div>

<!-- JAVASCRIPT -->

<script>

/* THEME */

const themeBtn =
document.getElementById("themeBtn");

themeBtn.addEventListener("click",()=>{

  document.body.classList.toggle("light");

});

/* SIDEBAR */

const menuBtn =
document.getElementById("menuBtn");

const sidebar =
document.getElementById("sidebar");

menuBtn.addEventListener("click",()=>{

  sidebar.classList.toggle("active");

});

</script>

</body>
</html>
